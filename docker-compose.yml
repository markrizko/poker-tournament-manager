version: '3.8'

services:
  poker-tournament-manager:
    build: .
    image: poker-tournament-manager:latest
    container_name: poker-tournament-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # URL to your Gitea repository (e.g. http://192.168.1.100:3000/username/poker-tournament-manager.git)
      - REPO_URL=http://<GITEA_HOST_OR_IP>:<GITEA_PORT>/<USER>/poker-tournament-manager.git
      - BRANCH=main
      
      # Optional: Gitea credentials if the repository is private
      # - GITEA_USER=your_user
      # - GITEA_PASSWORD=your_password
      # Or:
      # - GITEA_TOKEN=your_personal_access_token

      # Set your Synology NAS IP so the QR code and LAN links generated on the dashboard point to the NAS
      - HOST_IP=192.168.1.xxx
      
      - PORT=3000
      - TZ=America/New_York
    volumes:
      # Persists tournament state, custom blinds, and timer configuration across updates
      - ./data:/data
      # Caches cloned git repository between container restarts for fast startup
      - ./repo-cache:/app/repo
